<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense & Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tracker-card">
        <h1>💸 Personal Expense Tracker</h1>
        <p class="subtitle">Keep track of your daily income and expenses effortlessly.</p>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="summary-box balance">
                <h3>Total Balance</h3>
                <p id="total-balance">₹0.00</p>
            </div>
            <div class="summary-box income">
                <h3>Total Income</h3>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="summary-box expense">
                <h3>Total Expense</h3>
                <p id="total-expense">₹0.00</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <h2>Add New Transaction</h2>
        <form id="transaction-form">
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g., Grocery, Salary, Coffee" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="e.g., 250" step="any" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Salary & Income">Salary & Income</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="income">Income (+)</option>
                        <option value="expense" selected>Expense (-)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-add">Add Transaction</button>
        </form>

        <!-- Transaction History Table -->
        <h2>Transaction History</h2>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transaction-list">
                <!-- Dynamic rows will be added here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
